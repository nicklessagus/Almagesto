# Ratchet de trazabilidad requisito ↔ código.
#
# QUÉ ES ESTO. `docs/contrato.md` §3 enuncia 91 invariantes. Los números de abajo son DEUDA MEDIDA
# —cuántos NO tienen marca `@inv` en el código— y el sentido de la flecha importa: **el techo sólo
# puede bajar**. Exigir 0 sería rojo permanente, y un rojo permanente se deja de mirar, que es el
# modo de falla que este mecanismo existe para evitar.
#
#   - conteo por ENCIMA del techo → `trace_invariants.py` sale 1. Alguien agregó invariantes al
#     contrato sin marcarlos, o borró marcas: hay que mirarlo antes de que se pierda en el ruido.
#   - conteo por DEBAJO → pasa, y el artefacto pide bajar el techo acá. Un techo viejo que nadie
#     ajusta deja de ser ratchet y se vuelve un número decorativo.
#   - el techo NUNCA se sube para poner verde un rojo. Sólo se justifica si el contrato incorporó
#     invariantes nuevos legítimamente sin marcar todavía — y ese commit tiene que decir por qué.
#
# CÓMO SE BAJA. Cada issue del plan (`docs/plan-implementacion-2026-08-23.md`) declara qué
# invariante cierra; al cerrarlo se pone `@inv INV-nn` en la función que lo implementa y en el test
# que lo prueba, se corre `python scripts/trace_invariants.py` y se copian acá los conteos nuevos
# con la fecha.
#
# LA PASADA RETROACTIVA YA CORRIÓ (2026-08-24). El techo bajó de 77 a 7. El mapa se armó con **dos
# pasadas ciegas e independientes** sobre `contrato.md` §3, cruzadas después: cada marca es un
# símbolo que las dos nombraron, y los 67 tests + 51 símbolos que se marcaron existían todos (cero
# nombres inventados, que era el riesgo del método).
#
# LOS SIETE QUE QUEDAN SON HUECOS REALES, no falta de marcado — eso es el hallazgo de la pasada:
#   · INV-05  las plantillas de `make_notes` no tienen test que las audite buscando prosa que
#             describa a un consumidor downstream.
#   · INV-19  NO EXISTE herramienta de borrado/renombre de ENTIDAD (sólo `rename_paper`, a nivel
#             paper): nadie limpia `registro/<slug>.yaml`, `raw/{pdfs,fulltext}/<slug>/`, la entrada
#             en `stars.yaml`/`themes.yaml` ni `build/<slug>/`, y ningún chequeo los ve colgados.
#   · INV-23  la independencia del orden del PRIMER estampado de `fulltext` (`A,B` ≠ `B,A`) — es el
#             INC-3 abierto: los tres tests existentes prueban la rama "ya hay valor estampado".
#   · INV-66  rutas absolutas en artefactos versionados: sin chequeo y sin test.
#   · INV-73  que el benchmark no toque `vault/`: hoy lo garantiza la fixture, no una aserción.
#   · INV-86  `inferencia` sin premisas (issue 8.3, Tanda 8 — no empezada).
#   · INV-88  descubrimiento fuera de ADS y las tres puertas (Tanda 7 — no empezada).

medido_en: "2026-08-24"
almagesto_version: "1.31.0"
contrato_invariantes: 91

techos:
  sin_marca: 7    # medido: 2026-08-24 (pasada retroactiva) — 05, 19, 23, 66, 73, 86, 88.
  sin_test: 7     # medido: 2026-08-24 — los mismos siete.
