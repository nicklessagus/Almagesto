# Ratchet de trazabilidad requisito ↔ código.
#
# QUÉ ES ESTO. `docs/contrato.md` §3 enuncia los invariantes; **cuántos son lo dice el recolector**,
# no este archivo (issue #139: acá convivían un 91 en prosa y un 96 en campo mientras el conteo real
# era 126 — tres cifras para un hecho que `python scripts/trace_invariants.py` imprime). Los números
# de abajo son DEUDA MEDIDA
# —cuántos NO tienen marca `@inv` en el código— y el sentido de la flecha importa: **el techo sólo
# puede bajar**. Exigir 0 sería rojo permanente, y un rojo permanente se deja de mirar, que es el
# modo de falla que este mecanismo existe para evitar.
#
#   - conteo por ENCIMA del techo → `trace_invariants.py` sale 1. Alguien agregó invariantes al
#     contrato sin marcarlos, o borró marcas: hay que mirarlo antes de que se pierda en el ruido.
#   - conteo por DEBAJO → pasa, y el artefacto pide bajar el techo acá. Un techo viejo que nadie
#     ajusta deja de ser ratchet y se vuelve un número decorativo.
#   - el techo NUNCA se sube para poner verde un rojo. Sólo se justifica si el contrato incorporó
#     invariantes nuevos legítimamente sin marcar todavía — y ese commit tiene que decir por qué.
#
# CÓMO SE BAJA. Cada issue de trabajo declara qué
# invariante cierra; al cerrarlo se pone `@inv INV-nn` en la función que lo implementa y en el test
# que lo prueba, se corre `python scripts/trace_invariants.py` y se copian acá los conteos nuevos
# con la fecha.
#
# LA PASADA RETROACTIVA YA CORRIÓ (2026-08-24). El techo bajó de 77 a 7 y siguió bajando: **el
# número vigente es el del campo `techos:` de abajo, no el de este párrafo** — copiarlo acá es cómo
# se desincronizó (AUD-22: el relato decía 6 mientras el campo decía 3). El mapa se armó con **dos
# pasadas ciegas e independientes** sobre `contrato.md` §3, cruzadas después: cada marca es un
# símbolo que las dos nombraron, y todos los tests y símbolos marcados existían (cero nombres
# inventados, que era el riesgo del método). Los conteos vigentes los emite el propio recolector:
# NO se copian acá, porque copiarlos es cómo se desincronizaron la primera vez.
#
# LOS QUE QUEDAN NO SON FALTA DE MARCADO: no hay símbolo o no hay test que marcar, y ése es el
# hallazgo de la pasada. La lista viva es la de `techos:`; lo de acá abajo es el porqué de cada uno.
# ⚠ "hueco" acá es lenguaje corriente, NO el estado `HUECO` del contrato. **La autoridad del estado
# es el contrato, no este archivo** — por eso este bloque ya no lo repite: AUD-23/24 encontraron que
# atribuía a `contrato.md` estados que no tenía (decía que INV-19 seguía sin herramienta trece líneas
# antes de declarar que `entity.py` lo cerraba, y que INV-86 seguía en HUECO trece líneas antes del
# ✅ que lo daba cerrado).
#   · INV-05  las plantillas de `make_notes` no tienen test que las audite buscando prosa que
#             describa a un consumidor downstream.
#   · INV-23  la independencia del orden del PRIMER estampado de `fulltext` (`A,B` ≠ `B,A`) — es el
#             INC-3 abierto: los tres tests existentes prueban la rama "ya hay valor estampado".
#   · INV-66  rutas absolutas en artefactos versionados: sin chequeo y sin test.
#
# ✅ INV-86 salió con el issue 8.3 (la `inferencia` sin premisas ahora bloquea).
# ✅ INV-88 salió de la lista con la Tanda 7: las tres puertas de D-26 están
#    implementadas y medidas una por una. Queda su capa skill (issue 7.4), que no es
#    marcable — la conducta de un skill no la ve ningún recolector.

medido_en: "2026-08-27"
almagesto_version: "1.68.0"
# `contrato_invariantes` se eliminó (#139): nadie lo leía (`grep -rn contrato_invariantes scripts/
# tools/` → 0 hits fuera de este yaml) y era una copia que sólo podía envejecer. El total vigente lo
# emite el recolector, por el mismo argumento que ya rige para los techos.

techos:
  sin_marca: 6    # medido: 2026-08-28 (segunda pasada) — 05, 23, 95, 130, 132 y 133.
  sin_test: 6     # medido: 2026-08-28 — los mismos seis.
  # BAJA 7→6: INV-139 se cerró el mismo día que se enunció. Nació `INCUMPLIDO` a propósito —para
  #   nombrar los seis sitios que faltaban— y los seis se arreglaron en la misma tanda
  #   (AUD-131/145/146/149/200/201/202), así que hoy tiene marcas en implementación y en test. La
  #   subida 6→7 del commit anterior queda como lo que era: el estado transitorio de un invariante
  #   escrito antes que su implementación, no un aflojamiento del techo.
  # ⚠ INV-138 entró en la misma tanda y **NO movió el techo**: tiene sus marcas en implementación
  # (`lib_config.load_vistas`, `harvest_views.harvest`) y en cuatro tests. La diferencia entre los
  # dos es exactamente lo que este mecanismo mide.
  # ratchet-sube: sin_marca 3→6 — el contrato incorporó INV-130, 132 y 133 (issues #159/#160), los
  #   tres enunciando lo que FALTA: no hay símbolo que marcar todavía.
  # ratchet-sube: sin_test 3→6 — los mismos tres, por el mismo motivo: no hay test que marcar sobre
  #   una garantía que el contrato declara `parcial`/`HUECO`.
  # ⚠ SUBIÓ DE 3 A 6 Y ESTÁ JUSTIFICADO — es el único caso que el encabezado admite: el contrato
  # incorporó invariantes nuevos que legítimamente **no se pueden marcar todavía**. Los tres que
  # entraron (INV-130, 132, 133) salieron de la pasada `/auditar` del 2026-08-27 (issues #159 y
  # #160) y los tres enuncian lo que **FALTA**, no lo que hay:
  #   · INV-130 `parcial` — el límite de la cascada no-ADS no se persiste (`seed_terms` sólo avisa
  #     por stdout). La mitad ADS sí está medida, pero vive en INV-52.
  #   · INV-132 `parcial` — `discover.seed_terms` no es alcanzable desde el CLI. Marcar la función
  #     sería adjudicarle cobertura a un eje que nadie puede ejercer.
  #   · INV-133 `HUECO` — el mapa no distingue «no hay implementación» de «hay y no está marcada».
  #     No hay símbolo que marcar: lo que falta es decidir cómo se declara la diferencia.
  # Los otros cuatro que SÍ entraron con esta tanda (INV-127, 128, 129, 131) llevan sus marcas en
  # implementación y test, así que no movieron el techo. ⛔ Esto NO habilita subir el techo por
  # ningún otro motivo: cuando alguno de los tres se cierre, baja.
  # ⚠ SUBIÓ DE 2 A 3 Y ESTÁ JUSTIFICADO — es el caso que el encabezado admite: el contrato incorporó
  # un invariante nuevo que legítimamente no se puede marcar. INV-95 enuncia lo que garantiza el
  # propio mapa de trazabilidad, y `trace_invariants.py` + su test están EXCLUIDOS del recolector a
  # propósito (si no, se auto-adjudicaría cobertura: ya pasó con INV-87 e INV-90). O sea que lo
  # único que esta herramienta no puede medir es a sí misma, y eso ahora está dicho en vez de
  # escondido. NO es licencia para subir el techo por otros motivos.
  # INV-66 salió con la pasada de fix: los tests que la auditoría hizo escribir traen sus marcas
  # (`test_mailto_paridad.py` fija que la dirección de contacto NO se hardcodea en un artefacto
  # versionado, que es justo lo que INV-66 enuncia sobre rutas y datos per-instancia).
  # INV-19 salió de la lista: era el hueco más grande (no existía borrado/renombre de ENTIDAD, sólo
  # de paper). Lo cierra `scripts/entity.py` con las siete capas + la categoría *Capas colgadas* del
  # lint; lo miden los 12 tests de `tests/test_entity.py`.
  # INV-73 salió de la lista: era un P0 declarado «garantizado y medido» con CERO marcas, y el
  # aislamiento lo daba la fixture `toy_vault`, no una aserción. Ahora lo mide
  # `tests/test_bench_verify.py::test_el_benchmark_no_toca_el_vault` (hash del árbol de `vault/`
  # antes y después de `seed`).
