# Registro de TEMAS para ingest-theme (análogo a stars.yaml, pero por tema en vez de por estrella).
#
# La clave de cada entrada ES el slug → dir de build/<slug>/ y raw/{pdfs,fulltext}/<slug>/.
# Campos:
#   title    : nombre humano del tema.
#   area     : subcarpeta de vault/wiki/concepts/. ABIERTA — cualquiera; idealmente una de
#              `concept_areas` (objective.yaml; ej. indicators|methods|activity|hypotheses) para que
#              el typo-check la reconozca. Si no figura, make_notes AVISA pero crea igual (no bloquea)
#              y el lint la marca WARN; si es un área nueva real, agregala a concept_areas.
#   concept  : nombre de la nota concept durable destino (puede diferir del slug; existente o a stubbear).
#   query    : query Solr ADS CRUDA (control total; ver scripts/query_ads.py). NO es por nombre de estrella.
#   facet    : (TEMAS DE MÉTODO) la lente PROPIA del tema — una regex sobre título+abstract+keywords.
#              Hace falta porque la lente global de objective.yaml no sirve acá, y no por falta de
#              ajuste: con `require: [rv]` mata al paper FUNDACIONAL del método (Hyvärinen no
#              menciona RV ni una vez), y sin filtro "independent component analysis" devuelve
#              miles de papers de fMRI, EEG y finanzas. La regla es:
#                  core = facet propia  Y  (puerta 2  OR  puerta 3)
#              · puerta 2 «fundacional en su campo» — citation_count >= fundacional_min_citas
#              · puerta 3 «lente astro global»      — pasa relevance.facets de objective.yaml
#              (La puerta 1, «lo cita tu corpus», NO clasifica: PROPONE candidatos al triage.)
#   fundacional_min_citas : (opcional) umbral de la puerta 2. SIN default a propósito: el número
#              depende de tu campo —30k citas es normal en ML y muchísimo en astro— y esconderlo en
#              el código sería decidir por vos. Si no lo declarás, la puerta 2 NO abre y el motivo
#              lo dice; el tema entra sólo por la lente astro.
#   aliases  : opcional. Sirven para prosa, para el retro-tag por grep… y son los términos que
#              `discover.py` le manda a arXiv (cada backend recibe la query en SU idioma).
#   topic    : (opcional) id de subtema de OpenAlex (`T…`) para la cascada de `discover.py`.
#              Sacalo con `python scripts/discover.py --topics "<tema en inglés>"`. ⚠ DECLARALO:
#              sin él, `discover` intenta inferirlo del `title`, y si tu bóveda escribe los títulos
#              en castellano la taxonomía de OpenAlex (inglesa) no matchea y esa mitad de la
#              cascada no corre. No falla en silencio —lo dice en la cobertura— pero perdés el
#              backend que más aporta en temas no-astro.
#   extra_core : opcional. ⚠ FORMA DURA (D-58): lista de MAPAS `{bibcode, via, motivo}`, no de
#                bibcodes sueltos — la forma vieja aborta. `via` es vocabulario CERRADO:
#                usuario | triage | citado-por-corpus. Ver el ejemplo en stars.yaml.
#                Override del clasificador: query_ads trae por bibcode los ausentes y rescata los
#                que la query trajo marcados no-core. Persistente (config se commitea).
#                En un tema OFF-ADS también vale (tema MIXTO): los papers del tema que SÍ tienen
#                bibcode ADS van acá — NO en sources: con el bibcode de key (degrada el stub:
#                metadata a mano, blockquote off-ADS falso). ingest_theme les corre la sub-cadena ADS.
#   source   : de dónde sale la bibliografía (default si falta: ads). Valores:
#              ads | web | local-pdfs | local-pdfs+web. Todo lo no-ads es el modo off-ADS de
#              ingest-theme (opt-in, sólo a pedido explícito) y requiere `sources:`.
#              ⚠ En off-ADS, `query:` es OPCIONAL y NO es sólo decorativa (#104): si la poblás, el
#              orquestador corre el descubrimiento ADS COMPLETO para la mitad astro del tema (misma
#              lente, mismas puertas de D-26, misma compuerta de triage) en vez de limitarse a los
#              bibcodes de `extra_core`. Es lo que convierte un tema mixto de "enumerado a mano" en
#              "descubierto"; dejala en null si de verdad no querés que busque.
#   sources  : (sólo off-ADS) la bibliografía declarada del tema. Cada item:
#                - key: 2006RasmussenWilliams       # clave de cita sintética AAAA+Autor (obligatoria)
#                  url: https://...            # fuente web (snapshot vía fetch_web/defuddle) — o bien
#                  pdf: ~/ruta/al/archivo.pdf  # PDF provisto (se copia a raw/pdfs/<slug>/<key>.pdf;
#                                              # tras copiar, el orquestador REPUNTA este campo solo
#                                              # a la copia de la bóveda — repo-relative, portable —
#                                              # porque el path declarado suele ser staging efímero)
#                  title/author/year/venue     # opcionales: metadata para la nota de paper
#                  n_authors/doi               # opcionales: nº de autores; DOI si existe (un PDF con
#                                              # DOI sigue siendo off-ADS — sin bibcode ADS — y el DOI
#                                              # habilita el chequeo de retracciones vía Crossref)
#                  via: usuario               # OBLIGATORIO (#111). Vocabulario CERRADO:
#                                              #   usuario        — lo pediste vos
#                                              #   descubrimiento — lo propuso la cascada (discover)
#                                              #   reporte        — vino de un documento externo
#                                              # Era el ÚNICO de los cuatro cuadrantes de curación
#                                              # sin registro: `extra_core` dice quién y por qué
#                                              # (D-58), el descarte de un candidato (#51) y el de
#                                              # una fuente (#81) también. Y es el que MÁS lo
#                                              # necesita: en off-ADS no hay query que descubra, así
#                                              # que TODO entra por decisión de alguien. El lint lo
#                                              # bloquea; el snippet lo arma
#                                              # `triage.py <slug> --accept-source <doi>`.
#                  fecha: 2026-08-26           # cuándo se aceptó
#                  motivo: "..."               # OBLIGATORIO: por qué entra esta fuente
#                  pending: paywall            # la fuente NO está en disco todavía. Vocabulario
#                                              # CERRADO: paywall | scan | unextractable |
#                                              # adquisicion. Los tres primeros son un FALLO; el
#                                              # cuarto no —un libro que vas a conseguir no falló,
#                                              # tiene otra latencia— y antes entraba forzado como
#                                              # paywall, perdiendo el motivo real (#80). El item
#                                              # queda DERIVADO al usuario: stub con pending_source
#                                              # (url/doi como puntero), no cuenta como fallo y el
#                                              # lint lo lista. Al conseguir la fuente: reemplazar
#                                              # por pdf:/url: y re-correr.
#                  pending_motivo: "..."       # OBLIGATORIO con `pending`. En seis meses la
#                                              # categoría sola no dice si alguien la está
#                                              # consiguiendo o si nadie la miró nunca.
#                  unidad_cita: pagina         # (#80) cómo se apunta ADENTRO de esta fuente:
#                                              # linea (default, no hace falta declararlo) | pagina
#                                              # | seccion. Para un LIBRO o un handbook: el fan-out
#                                              # de verify-citations asume un .txt que se lee
#                                              # ENTERO (700 páginas lo revientan) y «línea 18443»
#                                              # no es una referencia que alguien pueda seguir.
#                                              # Es OTRO eje que el txt:/pdf: de la fila de
#                                              # verificación, que dice qué ARCHIVO se leyó.
#                  alcance: "caps. 6 y 15"     # OBLIGATORIO si unidad_cita no es `linea`: qué parte
#                                              # de la fuente entró. Un libro casi nunca entra
#                                              # entero, y sin esto el chequeo de completitud no
#                                              # puede distinguir un recorte deliberado de una
#                                              # omisión.
#
# La cadena mecánica se corre con `python scripts/ingest_theme.py <slug>` (despacha según `source`).
#
# Agregá tus temas acá (o dejá que `ingest-theme` los agregue). Ejemplo comentado:
#
# activity-rv:
#   title: "Actividad estelar ↔ velocidad radial (indicadores, signos, desfasajes)"
#   area: activity
#   concept: activity-rv-degeneracy
#   query: '(abs:"radial velocity" OR abs:"radial-velocity") (abs:"planet" OR abs:"exoplanet") (abs:"bisector" OR abs:"FWHM" OR abs:"S-index" OR abs:"activity indicator" OR abs:"chromospheric")'
#   aliases: ["BIS-RV", "indicadores de actividad"]
#
# Ejemplo off-ADS (método no-astro que se quiere usar en la bóveda; ver Modo off-ADS del skill ingest-theme):
#
# gaussian-processes:
#   title: "Procesos gaussianos (regresión: algoritmo y kernels)"
#   area: methods
#   concept: gaussian-processes
#   query: null
#   source: local-pdfs+web
#   aliases: ["GP", "gaussian process regression", "procesos gaussianos"]
#   facet: 'gaussian process|GP regression|kernel (function|method)'
#   fundacional_min_citas: 2000
#   sources:
#     - key: 2006RasmussenWilliams
#       pdf: ~/Descargas/rasmussen_williams_2006.pdf
#       title: "Gaussian Processes for Machine Learning"
#       author: Rasmussen
#       year: 2006
#     - key: 2025sklearn
#       url: https://scikit-learn.org/stable/modules/gaussian_process.html
#       title: "scikit-learn User Guide: Gaussian Processes"
#       venue: scikit-learn.org
#       year: 2025
