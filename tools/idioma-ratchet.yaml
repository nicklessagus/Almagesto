# Techo de símbolos de `scripts/` + `tools/` con nombre en CASTELLANO.
#
# Sólo puede BAJAR. Se mide con `pytest tests/test_idioma_codigo.py`.
#
# QUÉ ES ESTO. La convención del repo (2026-08-24, `CLAUDE.md`) es: archivos, nombres de funciones,
# docstrings y comentarios **nuevos** en inglés; la prosa de la doc sigue en castellano. **Sin
# retrofit** — lo ya escrito no se renombra.
#
# ⚠ POR QUÉ EXISTE ESTE ARCHIVO. Hasta el issue #156 la convención no vivía en ningún documento
# versionado (sólo en la bitácora interna, gitignored) y no la vigilaba nadie. Medido en la pasada
# `/auditar` del 2026-08-27: de 237 funciones nuevas desde que se decidió, 30 tienen nombre en
# castellano — y sobre el ÁRBOL ENTERO eran 46 al medir (el conteo VIGENTE lo da el test, hoy 45 =
# el techo de abajo), y `discover.py` —creado dos días antes de la medición— nació con 6 docstrings en
# castellano de 17. Una promesa que el sistema dejó de cumplir en silencio es peor que una que nunca
# hizo, y la salida no es un barrido de renombres (rompería wikilinks y marcas `@inv` por nada) sino
# un ratchet: la deuda queda declarada y sólo puede achicarse.
#
#   - conteo por ENCIMA del techo → el test falla. Alguien escribió un símbolo nuevo en castellano.
#   - conteo por DEBAJO → pasa, y avisa que hay que bajar el techo acá. Un techo que nadie ajusta
#     deja de ser ratchet y se vuelve decorativo (la lección de AUD-07).
#   - el techo NUNCA se sube. Si un símbolo nuevo lo necesita, el símbolo está mal nombrado.
medido_en: "2026-08-27"
techo: 45   # ocurrencias `archivo::símbolo`; `conocidos` son 43 NOMBRES
            # (tres viven en más de un archivo: `_listify_curado` en tres,
            #  y por eso los dos números no coinciden).

# ⚠ EL TECHO CUENTA EL ÁRBOL ENTERO, no sólo lo nuevo. El detector es estático (AST) y no puede
# saber cuándo se agregó un símbolo, así que la distinción «nuevo vs heredado» la sostiene la lista
# `conocidos` de abajo: un nombre que no esté ahí pone el test en rojo aunque el total no suba. Los
# dos números de la medición del 2026-08-27 son **30 sobre las funciones creadas desde la
# convención** y **45 sobre todo `scripts/` + `tools/`**; el segundo es el que gatea.
#
# Las seis funciones que la propia pasada de fix del 2026-08-27 escribió NO están acá: nacieron en
# castellano y se renombraron al inglés en el acto (`_field_is_marked`, `_better_txt`,
# `_merge_changes`, `_notes_citing`, `challenging_rows`, `_bare_verdict`). Escribir la regla y
# estrenarla incumpliéndola habría sido el mismo defecto un nivel más arriba.
