# Techo de funciones de `scripts/` + `tools/` testeadas SÓLO desde el archivo de OTRO módulo (#439).
#
# Sólo puede BAJAR. Se mide con `pytest tests/test_tests_en_su_archivo.py`.
#
# LA REGLA. Un test vive en `tests/test_<módulo>.py`, o las redes que miran POR MÓDULO no lo ven:
# `mutar --dirigida` y `--guardas` (AUD-213) corren sólo ese archivo —a propósito, es lo que las hace
# baratas—, así que una función testeada desde otro archivo sale «sin test propio que la mate»
# aunque tenga diez. Es INV-101 (la red que no mira el código nuevo no es una red) aplicado a
# DÓNDE vive el test.
#
# MEDIDO el 2026-09-11 cerrando #437: `--guardas scripts/lib_quotes.py` reportó 9 guardas vivas de
# `quote_verdict` —el juez del gate de cierre (#324)— con doce tests escritos… en
# `tests/test_lib_config.py`, donde la función se re-exporta. La medición «las guardas mueren» de
# #324/#333 se había hecho contra un archivo que no las ejercita. Al enumerar por AST: 36 funciones
# en 11 módulos en la misma situación; las de `lib_quotes` se mudaron en la misma tanda y quedan
# las de abajo como deuda declarada.
#
#   - conteo por ENCIMA del techo → el test falla: alguien testeó una función nueva desde otro archivo.
#   - un NOMBRE que no esté en `conocidos` → rojo aunque el total no suba (la deuda no rota).
#   - conteo por DEBAJO → pasa y avisa que hay que bajar el techo acá (AUD-07).
#   - el techo NUNCA se sube. Si una función nueva lo necesita, su test está en el archivo equivocado.
