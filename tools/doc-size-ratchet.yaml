# Techo de tamaño de `CLAUDE.md`. Sólo puede BAJAR. Se mide con `pytest tests/test_doc_size.py`.
#
# QUÉ ES ESTO. `CLAUDE.md` se inyecta ENTERO en el contexto de cada sesión de cada instancia: es el
# único documento del repo cuyo tamaño cuesta en cada operación. El 2026-08-30 medía 2258 líneas /
# 201 KB, y el 73 % de sus bytes era color-desarrollo (postmortems de issues, mediciones con corpus,
# «hasta 1.x este documento decía») — la cuarta copia de material que ya vive en los issues públicos,
# `docs/mediciones.md` y `docs/contrato.md`. El recorte lo bajó a lo de abajo; este ratchet impide
# que vuelva a crecer por acreción.
#
# LA REGLA DE ESCRITURA que este techo mecaniza: CLAUDE.md lleva **la regla y su consecuencia en una
# línea, con su ancla (#N/D-N)**; el caso que la produjo y la medición van al issue y a
# `docs/mediciones.md`. Idea tomada de agentic-memory-vault (límite de tamaño como regla forzada),
# implementada como ratchet al estilo `idioma-ratchet.yaml`.
#
#   - por ENCIMA del techo → el test falla: alguien inlineó color-desarrollo. La salida normal es
#     mover el porqué a su issue/mediciones.md y dejar la regla con su ancla.
#   - por DEBAJO con margen (>3 %) → pasa y avisa que hay que bajar el techo (un techo que nadie
#     ajusta se vuelve decorativo — AUD-07).
#
# ⛔ SUBIR EL TECHO SE PUEDE, Y NUNCA EN SILENCIO (#340). Hasta 1.150.0 el techo era un muro: sólo
# bajaba. Eso funcionó mientras hubiera postmortem que mover — pero medido el 2026-08-31, sólo el
# **3 %** de CLAUDE.md (43 de 1620 líneas, 4161 de 128011 B) lleva marca de postmortem, y las tres
# secciones que el plan de recorte marcaba para una segunda pasada tienen 696 B entre las tres. O
# sea: el archivo ya está en su densidad de diseño, y «sólo baja» se había convertido en «no se
# puede escribir ninguna regla nueva». Medido: en la tanda #329-#335, TRES fixes decidieron no
# escribir su regla por falta de espacio, en silencio y sin registro.
#
# Ahora el techo es un AVISO con firma: se puede subir, y cada suba deja su entrada en
# `crecimientos` con fecha, ancla y motivo. Lo que sigue prohibido es que el archivo crezca sin que
# nadie lo declare — que es lo que el ratchet vino a frenar. `test_la_suba_del_techo_esta_declarada`
# lo vigila: el techo vigente tiene que ser el de la última entrada.
medido_en: "2026-08-31"
techo_lineas: 1672
techo_bytes: 132900

