      - modulo: scripts/fetch_ground_truth.py
        estado: fuera-de-alcance
        motivo: >-
          decide en `if out.exists() and not args.force`; el sujeto ES la unidad. Auditado en #420: no tenía el defecto.
      - modulo: scripts/fetch_pdf.py
        estado: fuera-de-alcance
        motivo: >-
