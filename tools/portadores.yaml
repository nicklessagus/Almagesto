    regla: >-
      La exportación se pide en la forma en que se PEGA, y el bloque `bibtex` no se post-procesa:
      un bloque que NO SE PEGA no está cerrado. #471 lo implementó contra un síntoma —la macro de
      revista de ADS, `journal = {\aap}`, que sin `aas_macros.sty` compila VACÍO: 126 de 219
      bloques `ads` de una instancia— y por eso daba por cerrado el carril Crossref, que llega no
      pegable de otras dos maneras (#473: el cascarón sin autor ni título imprime la cita VACÍA; el
      mes `month=July` no lo define ningún `.bst`). La salida NUNCA es reescribir el campo acá
      —sería redactar la cita, que es lo que #397 prohíbe—: se pide la exportación en la forma
      pegable, y cada clase declara su consecuencia en `BIBTEX_NO_PEGABLE` (`pendiente` se re-baja ·
      `descartable` no se guarda y la cascada sigue · `residuo` se nombra y no se re-baja). UNA
      función decide «no está cerrado» para los dos lectores.
    funcion: lib_config.bibtex_no_pegable
    patron: 'journalformat|get\("bibtex"\)'
    consumidores:
