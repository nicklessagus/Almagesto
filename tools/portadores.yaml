          el registro bueno. Lo encontró la red 10, no el reporte.
      - modulo: scripts/lib_blocks.py
        estado: fuera-de-alcance
        motivo: Matchea por la palabra «issued» en un docstring en inglés; no lee fechas de Crossref.

  - issue: 413
