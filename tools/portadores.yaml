      el derivable y el artefacto declara CUÁL publica. La matriz método × estrella prometía
      espejar `methods_applied.literature` (curación del agente, sin bibcode) llenándose desde
      `methods` (extracción, vocabulario abierto, #243): medido, 23 de 42 métodos declarados sin
      ningún paper del sujeto que matchee por `method_key`, con el eje de filas mezclando idiomas
      entre fichas. Llenarla igual publicaba huecos FALSOS, y un `—` falso no lo mira ninguna capa
      (`verify-citations` va claim↔fuente y `find-contradictions` claim↔claim: las dos parten de
      una cita). ⚠ Dentro de `make_notes` la regla tiene un segundo portador que este gate no ve
      por ser del mismo módulo: `metodos_table` y `matrix_table` comparten `method_label` —una sola
      definición de cómo un nombre de método resuelve a página (stem o alias, #245) y de que la
      grafía del extractor no se reescribe—.
    funcion: make_notes.matrix_rows
    patron: 'method_key|methods_applied'
    consumidores:
      - modulo: scripts/lint.py
        estado: usa
        motivo: >-
          `check_matrix_stale` compara la sección estampada contra lo que `matrix_rows` +
          `matrix_table` dan hoy; si derivara su propia versión, el detector y el estampador
          divergirían y el backlog nunca cerraría.
      - modulo: scripts/lib_config.py
        estado: fuera-de-alcance
        motivo: >-
          Es donde vive `method_key`, la transformación que la regla usa para comparar; no publica
          ningún roll-up.
      - modulo: scripts/harvest_views.py
        estado: fuera-de-alcance
        motivo: >-
          Nombra `method_key` para declarar que NO lo usa (#410: la pertenencia de una vista se
          compara por igualdad literal contra el slug del sujeto); no arma roll-ups.
      - modulo: scripts/fetch_bibtex.py
        estado: fuera-de-alcance
        motivo: >-
          Usa `method_key` como normalizador de TÍTULOS para cruzar la exportación contra el
          frontmatter (#397); nada que ver con métodos ni con roll-ups.
  - issue: 432
    regla: >-
      El ALCANCE de una sección estampada termina en el próximo `## `, nunca en cualquier `#`: un
      `###` adentro NO reabre los bloques citables. La regla tenía dos implementaciones con
      semánticas distintas — `solo_prosa` salteaba hasta el próximo `## `, `lib_blocks.split_blocks`
      reevaluaba en CADA encabezado —, así que un sub-encabezado dentro de `## Verificación de
      citas` apagaba la exclusión y sus ítems volvían como bloques citables: `pairs_of` emitía un
      par desde adentro del propio bloque que lo juzga (el lazo autorreferencial que el docstring de
      `lib_blocks` dice evitar, y un par que nadie puede resolver). Latente al medirlo —la plantilla
      de #344 escribe las tres sub-secciones como párrafos— y nada prohíbe titular una con `###`.
      Misma familia que #214.
    funcion: lib_config.stamped_scope
    patron: 'SECCIONES_ESTAMPADAS|is_stamped_section'
    consumidores:
      - modulo: scripts/lib_blocks.py
        estado: usa
        motivo: >-
          `split_blocks` decide qué es un bloque citable; es la mitad que tenía la semántica
          divergente y la que produce los pares.
      - modulo: scripts/lint.py
        estado: usa
        motivo: >-
          `check_impl_leaks` barre línea por línea con el mismo estado; `_lines_with_section`
          empareja cada línea con su `## ` y delega el veredicto en `is_stamped_section`, así que
          ya cortaba por `## ` (no reimplementa el alcance).
      - modulo: scripts/harvest_views.py
        estado: fuera-de-alcance
        motivo: >-
          Matchea sólo por un DOCSTRING que declara que las cuatro secciones de lectura van en
          `SECCIONES_ESTAMPADAS`; no barre el cuerpo de ninguna nota.
      - modulo: scripts/lib_quotes.py
        estado: fuera-de-alcance
        motivo: >-
          Matchea sólo por un COMENTARIO que cita la doctrina al explicar la exención del `log.md`
          (#391); su exención sale de `Block.kind`, no de recorrer encabezados.
