      El año de una fuente es el que la CITA usa —para un artículo de revista, el de imprenta—, y
      Crossref pone en `issued` el más temprano de print y online. Se leen los dos y vale
      cualquiera de ellos: cuál usa una cita es convención del editor, no algo que este repo decida
