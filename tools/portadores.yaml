# ⛔ QUIÉN MÁS LLEVA CADA REGLA — la declaración que `tools/carriers.py --check` gatea.
#
# POR QUÉ EXISTE. Cuatro lectores independientes clasificaron los ~400 issues del repo por
# mecanismo, sin verse entre ellos, y tres nombraron el mismo tema dominante (el cuarto, su causa):
# **el fix se escribe contra el caso medido y no contra la relación estructural que lo contiene**.
# Medido: 45 de 100 issues en un tramo, ~50 en otro, 32 en el último, y casi la mitad presentándose
# con la fórmula literal «#N lo cerró para X y dejó Y igual».
#
# ⛔ **Un issue cuyo fix tiene portadores no se cierra sin su entrada acá.** La entrada declara la
# regla, la ÚNICA función que la implementa, y el `patron` por el que se reconoce a un portador en
# el código; el gate compara las dos direcciones y **rehúsa** si alguien llama sin estar declarado,
# si un declarado `usa` no llama (el comentario que dice «delega» y no delega, #347), o si un
# módulo matchea el patrón y nadie dijo nada de él.
#
# CÓMO SE ESCRIBE UNA ENTRADA — la lista NO se escribe de memoria:
#
#     python tools/carriers.py --propose lib_config.txt_slug --patron 'FULLTEXT\s*/\s*\w+\s*/'
#
# imprime quién LLAMA (van `usa`) y quién MATCHEA y no llama (cada uno `usa` —y se lo hace llamar—
# o `fuera-de-alcance` CON motivo). El `patron` es la parte que piensa una persona: es la relación
# estructural escrita, y es lo único que hace que el barrido termine donde termina la clase y no
# donde el agente dejó de mirar.
#
# `fuera-de-alcance` necesita `motivo` por el mismo argumento que el `--reason` del triage: en seis
# meses sirve el motivo, no la categoría.

portadores:
  - issue: 405
    regla: >-
      Resolver el `.txt` de un bibcode entre TODOS los slugs, no sólo bajo el del sujeto: el paper
      retro-tagueado tiene su artefacto bajo el slug que lo ingestó primero. Seguro sólo porque
      D-18/D-20 vigilan que el mismo bibcode no tenga `.txt` distinto entre slugs.
    funcion: lib_config.txt_slug
    patron: 'FULLTEXT\s*/\s*\w+\s*/'
    consumidores:
      - modulo: scripts/extraction_prompt.py
        estado: usa
        motivo: el prompt dice si hay índice y a qué copia apuntan sus `grep`
      - modulo: scripts/write_verif_sidecar.py
        estado: usa
        motivo: elige contra qué archivo se hashea la fila (`txt:` kind)
      - modulo: scripts/harvest_views.py
        estado: usa
        motivo: >-
          `_resolve_txt_slug` era una SEGUNDA implementación idéntica línea por línea; delega desde
          1.242.0. Fue el primer hallazgo de este gate.
      - modulo: scripts/fetch_web.py
        estado: fuera-de-alcance
        motivo: >-
          ESCRIBE el snapshot. Escribir es siempre bajo el slug del sujeto que lo pidió: resolver
          entre slugs al escribir pisaría la copia de otro sujeto.
      - modulo: scripts/make_notes.py
        estado: fuera-de-alcance
        motivo: >-
          Estampa `fulltext:` por verdad de disco para la nota de ESE slug, y el campo es un puntero
          relativo a esa copia. Apuntar a la de otro slug haría que el link de la nota no resuelva.
      - modulo: scripts/triage.py
        estado: fuera-de-alcance
        motivo: >-
          BORRA los artefactos de un par (paper, sujeto) dropeado. El borrado es por slug por
          diseño (#112): resolver entre slugs borraría la copia que otro sujeto sí quiere.
      - modulo: scripts/check_sources.py
        estado: fuera-de-alcance
        motivo: >-
          Lee el SNAPSHOT WEB de una fuente declarada, que `fetch_web` escribe bajo el slug del
          tema que la declaró y no existe bajo ningún otro: no hay copia ajena que resolver.
      - modulo: scripts/lint.py
        estado: fuera-de-alcance
        motivo: >-
          Cuenta los `.txt` de un DIRECTORIO de slug (el universo declarado de una hipótesis, D-34);
          no resuelve un bibcode, así que la regla no aplica.

  - issue: 305
    regla: >-
      Resolver el PDF de un bibcode entre TODOS los slugs — el gemelo de #405, y el que lo produjo:
      #207 invertido, el prompt mandaba declarar `fuente: abstract` sobre un paper que SÍ está en
      disco bajo otro sujeto.
    funcion: lib_config.pdf_slug
    patron: 'PDFS\s*/\s*\w+\s*/'
    consumidores:
      - modulo: scripts/extraction_prompt.py
        estado: usa
        motivo: "decide si el prompt manda leer el PDF o declarar `fuente: abstract`"
      - modulo: scripts/harvest_views.py
        estado: usa
        motivo: "cruza `fuente: pdf` contra el disco y rechaza la extracción que miente (#207)"
      - modulo: scripts/write_verif_sidecar.py
        estado: usa
        motivo: elige el `pdf:` kind y su hash por bytes
      - modulo: scripts/make_notes.py
        estado: fuera-de-alcance
        motivo: >-
          Ídem `fulltext:`: estampa `pdf:` para la nota de ESE slug y el campo es un puntero
          relativo a esa copia.
      - modulo: scripts/triage.py
        estado: fuera-de-alcance
        motivo: borra los artefactos del par dropeado, por slug (#112)
      - modulo: scripts/check_sources.py
        estado: fuera-de-alcance
        motivo: >-
          Abre la primera página del PDF que la fuente DECLARA en su `pdf:`, para cruzar autor/año
          (#353). Es el archivo declarado, no una búsqueda por bibcode.
      - modulo: scripts/ingest_theme.py
        estado: fuera-de-alcance
        motivo: >-
          Copia el PDF local que el usuario declaró en `sources[]` hacia el slug del tema: es una
          escritura, y el destino es por definición el slug del sujeto.

  - issue: 403
    regla: >-
      El hermano `<nota>.verif.md` se ESCRIBE por un solo camino: desde un fan-out que pasó la
      barrera, emparejando por `(bibcode, ancla)` y hasheando por tipo de archivo. Un segundo
      escritor produce filas que nadie cruzó contra el manifiesto — medido, el agente lo escribió a
      mano cuatro veces y dos salieron mal (117 falsos «vencido por fuente»).
    funcion: write_verif_sidecar.main
    patron: 'render_verif_sidecar'
    consumidores:
      - modulo: scripts/lib_blocks.py
        estado: fuera-de-alcance
        motivo: DEFINE la primitiva de render; no la consume.
      - modulo: scripts/make_notes.py
        estado: fuera-de-alcance
        motivo: >-
          `--migrate-verif-sidecar` MUEVE la tabla verbatim y a propósito no la re-renderiza, para
          que anclas y hashes sobrevivan (#344). Construir filas desde un fan-out es otra operación.

  - issue: 404
    regla: >-
      El identificador interno de la bóveda no es un método del paper, y se lo reconoce por el
      string LITERAL — nunca por `method_key`, que aplica la regla al revés en todo tema cuyo slug
      ES el nombre del método (#410: 24 grafías legítimas descartadas contra 19 defectos reales).
      El filtro vive en la única compuerta que ESCRIBE `methods` en una nota.
    funcion: harvest_views.split_subject_slugs
    patron: '"methods":\s*\['
    consumidores:
      - modulo: scripts/extraction_prompt.py
        estado: fuera-de-alcance
        motivo: >-
          Emite el ESQUELETO del JSON que el extractor completa — es donde el slug se pregunta, no
          donde se publica. El JSON es versionado y no se toca (#311).
      - modulo: scripts/make_notes.py
        estado: fuera-de-alcance
        motivo: >-
          Crea la clave VACÍA en el stub y la lee para los roll-ups; el único que le mete valores
          es el cosechador.

  - issue: 406
    regla: >-
      Una unidad tiene que seguir a un número: si sigue a una palabra, hubo un empalme. El
      vocabulario de unidades es de ESTA bóveda —castellano, y astronomía—, así que `mas` y `K` no
      entran (#411: 372 de 533 hits eran «más» sin tilde, tipo espectral y línea Ca II K).
    funcion: lint.check_unit_seams
    patron: 'm/s|km/s|mas/yr'
    consumidores:
      - modulo: scripts/bench_verify.py
        estado: fuera-de-alcance
        motivo: Unidades dentro de las citas SEMBRADAS del benchmark; no decide qué es una unidad.
      - modulo: scripts/make_notes.py
        estado: fuera-de-alcance
        motivo: Unidades en literales de plantilla (cabeceras, ejemplos); no implementa la regla.

  - issue: 414
    regla: >-
      El año de una fuente es el que la CITA usa —para un artículo de revista, el de imprenta—, y
      Crossref pone en `issued` el más temprano de print y online. Se leen los dos y vale
      cualquiera de ellos: cuál usa una cita es convención del editor, no algo que este repo decida
      por quien consume (regla #0).
    funcion: lib_config.crossref_years
    patron: 'issued'
    consumidores:
      - modulo: scripts/check_sources.py
        estado: usa
        motivo: El cruce de #353 comparaba contra `issued` y desmentía el año correcto.
      - modulo: scripts/fetch_bibtex.py
        estado: usa
        motivo: >-
          El segundo portador, con el MISMO defecto y sin aparecer en el síntoma: filtra los
          candidatos de DOI por año con tolerancia ±1, así que en un online-first descartaba solo
          el registro bueno. Lo encontró la red 10, no el reporte.
      - modulo: scripts/lib_blocks.py
        estado: fuera-de-alcance
        motivo: Matchea por la palabra «issued» en un docstring en inglés; no lee fechas de Crossref.

  - issue: 413
    regla: >-
      «Todavía tiene el placeholder» es UNA condición: la sección `## Abstract` existe y su cabeza
      sigue llevando `ABSTRACT_PLACEHOLDER`. Distingue el schema viejo —sin sección, que arregla
      `--restamp-abstracts`— del hueco de contenido, y un abstract real no se pisa nunca.
    funcion: lib_config.abstract_pending
    patron: 'ABSTRACT_PLACEHOLDER'
    consumidores:
      - modulo: scripts/make_notes.py
        estado: usa
        motivo: >-
          `--fill-abstracts` (#413) y el conteo de pendientes de `--restamp-abstracts`.
      - modulo: scripts/harvest_views.py
        estado: usa
        motivo: >-
          Llevaba la MISMA regla escrita por separado (`_ini >= 0 and PLACEHOLDER in
          texto[_ini:_ini+200]`); hoy delega. Es el caso que la red 10 caza.
      - modulo: scripts/triage.py
        estado: fuera-de-alcance
        motivo: Escribe el placeholder al armar el stub; no decide si una nota sigue pendiente.

  - issue: 415
    regla: >-
      `pdf_source` DECIDE LECTURAS (con `eprint`, una discrepancia numérica es candidata a
      diferencia de versión), así que su procedencia tiene tres escalones y en ese orden: la marca
      de arXiv (verdad de disco, #57), lo DECLARADO en `sources:` (versionado, #415) y el registro
      del fetcher en `build/` (scratch gitignored). Sin ninguno, `null` = desconocido, que no es
      «publicado».
    funcion: make_notes.pdf_source_info
    patron: 'record_pdf_source'
    consumidores:
      - modulo: scripts/fetch_arxiv.py
        estado: fuera-de-alcance
        motivo: ESCRIBE el registro de `build/` (la otra mitad de la regla); no lo resuelve.
      - modulo: scripts/fetch_pdf.py
        estado: fuera-de-alcance
        motivo: Ídem — registra la rama que entregó el PDF en la corrida.
      - modulo: scripts/fetch_web.py
        estado: fuera-de-alcance
        motivo: Ídem, para el snapshot web.
      - modulo: scripts/lib_config.py
        estado: fuera-de-alcance
        motivo: Define `record_pdf_source` y el vocabulario `PDF_SOURCE_OK`; no resuelve la precedencia.
