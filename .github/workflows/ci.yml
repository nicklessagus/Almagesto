# CI de Almagesto (framework) — corre el lint de la bóveda en cada push/PR a main.
#
# scripts/lint.py es un chequeo OFFLINE de salud estructural del vault (wikilinks
# rotos, notas huérfanas, contradicciones ground-truth ↔ ficha, papers retractados
# citados, disputes[].ref sin destino, …); sale con exit 1 si hay bloqueantes.
#
# Sólo necesita pyyaml + stdlib: astroquery se importa lazy dentro de funciones de
# fetch_ground_truth (de donde lint toma msini_earth), no al cargar el módulo. Sin
# git-lfs: el lint lee el fulltext .txt (commiteado) y el frontmatter, nunca los PDFs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar deps del lint
        run: pip install pyyaml
      - name: Lint de la bóveda
        run: python scripts/lint.py

  # Suite de tests de la capa determinista (scripts/): sin red ni binarios externos —
  # todo mockeado (ver tests/README.md). astroquery no hace falta (se fakea vía sys.modules).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar deps de la suite
        run: pip install pyyaml requests numpy pytest
      - name: Tests de scripts/
        run: python -m pytest tests/ -q

      # `docs/trazabilidad.md` es un artefacto GENERADO por `trace_invariants.py`, y hasta #138 nada
      # verificaba que el commiteado fuera el vigente: en 69b49d5 le faltaban dos marcas, o sea que
      # el mapa sub-reportaba su propia cobertura (INV-95 dice que "dice la verdad" sobre ella).
      # Va acá y no en tier 0 porque parsear el AST de scripts/ + tests/ cuesta ~5 s, y el tier 0
      # entero corre en ~8 s: sumarlo lo encarecería ~60 % para un chequeo que no cambia entre
      # pushes. Se arregla con `python scripts/trace_invariants.py`.
      - name: El mapa requisito↔código está al día
        run: python scripts/trace_invariants.py --check
