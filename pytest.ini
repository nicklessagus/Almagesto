[pytest]
# TIERS de la suite. El `addopts` es lo que protege el presupuesto del tier 0: sin él, agregar la
# capa de bóveda poblada convertiría `pytest tests/` de ~2 s en minutos, y una suite que tarda es
# una suite que se deja de correr antes de commitear — que es justo cuando más sirve.
#
#   tier 0 (default, CI en cada push):  python -m pytest tests/ -q
#   tier 1 (poblada, nightly/pre-release):  python -m pytest tests/ -m poblada -q
#   tier 2 (instancia real, gate del deploy):
#       ALMAGESTO_INSTANCIA=/ruta/a/la/instancia python -m pytest tests/ -m instancia -q
#   todo junto (pre-release en la máquina del usuario):
#       ALMAGESTO_INSTANCIA=... python -m pytest tests/ -m "" -q
#
# `instancia` sin la env var **skipea con motivo visible**, nunca pasa en silencio: un tier que se
# saltea sin decirlo es el mismo modo de falla que el "0 que no miró" del lint.
markers =
    poblada: corpus sintético a escala (~900 notas); segundos, no milisegundos
    instancia: requiere ALMAGESTO_INSTANCIA apuntando a una instancia real (se usa READ-ONLY)
addopts = -m "not poblada and not instancia"
